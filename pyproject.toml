[project]
name = "aws-sso-mcp"
version = "0.1.0"
description = "MCP server for AWS IAM Identity Center (SSO): multi-org, multi-account AWS querying and management from a chat client."
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Arnab Das", email = "arnabds991@gmail.com" }
]
keywords = ["aws", "sso", "iam-identity-center", "mcp", "model-context-protocol", "multi-account"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0",
    "boto3>=1.34",
    "botocore>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-randomly>=3.15",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "vulture>=2.11",
    "boto3-stubs[sso,sso-oidc,sts,ec2]>=1.34",
    "build>=1.2",
    "twine>=5.0",
    "pre-commit>=3.7",
]
audit = [
    "pip-audit>=2.7",
    "zizmor>=1.11",
]

[project.urls]
Homepage = "https://github.com/arnabdas24/aws-sso-mcp"
Repository = "https://github.com/arnabdas24/aws-sso-mcp"
Issues = "https://github.com/arnabdas24/aws-sso-mcp/issues"
Changelog = "https://github.com/arnabdas24/aws-sso-mcp/blob/main/CHANGELOG.md"

[project.scripts]
aws-sso-mcp = "aws_sso_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# BLE is enabled deliberately: this codebase has several *justified* blind
# excepts at isolation boundaries (tool entry points, best-effort progress and
# audit reporting). Selecting BLE makes each of their `# noqa: BLE001`
# directives meaningful, and forces any new blind except to be justified too.
select = [
    "E", "F", "I", "UP", "B", "SIM", "N", "S", "BLE", "RUF100",
    "DTZ",  # naive datetimes (a real bug here once: UTC vs local staleness)
    "PT",   # pytest style
    "RET",  # needless else / inconsistent returns
    "PERF", # avoidable loop overhead
    "C4",   # unnecessary comprehensions / calls
    "LOG", "G", # logging API misuse and eager formatting
    "ARG",  # unused arguments
    "TRY",  # exception-handling anti-patterns
]
# TRY003: errors here carry deliberate, user-facing messages; defining one
# exception class per message would add noise without adding safety.
ignore = ["TRY003"]

[tool.ruff.lint.per-file-ignores]
# Tests assert with `assert`, use fake credentials, stub with unused params.
"tests/**" = ["S101", "S105", "S106", "S107", "S311", "ARG", "TRY"]
# Bare attribute references are the whitelist format vulture expects.
"vulture_whitelist.py" = ["B018", "E402"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
warn_unreachable = true
enable_error_code = ["possibly-undefined", "redundant-expr", "truthy-bool"]

[tool.coverage.run]
branch = true
source = ["aws_sso_mcp"]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
addopts = "--cov --strict-markers --strict-config"
testpaths = ["tests"]
# Any warning is a failure so deprecations surface in CI rather than in users' sessions.
filterwarnings = ["error"]

# Dead-code gate: `uv run vulture` (also run in CI).
[tool.vulture]
paths = ["src", "vulture_whitelist.py"]
min_confidence = 60
