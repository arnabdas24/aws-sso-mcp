[project]
name = "aws-sso-mcp"
version = "0.1.0"
description = "Standalone MCP server for AWS IAM Identity Center (SSO) multi-org, multi-account, read-only AWS querying."
authors = [
    { name = "Arnab Das", email = "arnabds991@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0",
    "boto3>=1.34",
    "botocore>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "boto3-stubs[sso,sso-oidc,sts,ec2]>=1.34",
]

[project.scripts]
aws-sso-mcp = "aws_sso_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S311"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true

[tool.pytest.ini_options]
addopts = "--cov=aws_sso_mcp --cov-report=term-missing --cov-fail-under=85"
