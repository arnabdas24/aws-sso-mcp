name: Mutation testing

# Coverage proves a line *ran*; mutation testing proves an assertion would have
# *caught* a change to it. This deliberately mutates only the security-critical
# modules - a surviving mutant there means a real gap in the tests.
#
# Advisory and weekly, never a merge gate: mutation runs are slow and a
# surviving mutant needs human judgement, not an automatic red X.
#
# Linux only. mutmut imports the Unix-only `resource` module, so it cannot run
# on Windows or in a Windows developer checkout.

on:
  schedule:
    - cron: "0 4 * * 1" # Mondays, 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutmut:
    name: mutmut (security-critical modules)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv sync --locked --extra dev
          uv pip install mutmut==3.2.0

      # continue-on-error: a surviving mutant is a finding to triage, not a
      # build break. Review the summary and the artifact, then either add a
      # test or record why the mutant is equivalent.
      - name: Run mutation tests
        id: mutmut
        continue-on-error: true
        run: uv run --no-sync mutmut run

      - name: Summarise results
        if: always()
        run: |
          uv run --no-sync mutmut results | tee mutmut-results.txt
          {
            echo '## Mutation testing results'
            echo '```'
            cat mutmut-results.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutmut-results
          path: mutmut-results.txt
          if-no-files-found: ignore
