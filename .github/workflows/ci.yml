name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets release.yml run the full suite as a gate before publishing.
  workflow_call:

# Least privilege: CI only needs to read the repository contents.
permissions:
  contents: read

# Cancel superseded runs for the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      # --locked fails if uv.lock is out of date with pyproject.toml, so CI
      # always tests exactly the dependency set that is committed.
      - name: Install package + dev dependencies (locked)
        run: uv sync --locked --extra dev

      - name: Ruff lint
        run: uv run --no-sync ruff check .

      - name: Ruff format check
        run: uv run --no-sync ruff format --check .

      - name: mypy (strict)
        run: uv run --no-sync mypy src

      - name: Dead-code check (vulture)
        run: uv run --no-sync vulture

      # A renamed file or reworded heading breaks a link silently; the
      # reader finds out, not the author.
      - name: Documentation links
        run: uv run --no-sync python scripts/check_doc_links.py

      - name: pytest (coverage gate >= 85%, random order)
        run: uv run --no-sync pytest --cov-report=json:coverage.json

      # The global 85% gate lets a well-tested module subsidise a neglected
      # one. These floors pin the modules where a gap is a security risk.
      - name: Per-module coverage floors
        run: uv run --no-sync python scripts/check_coverage_floors.py coverage.json

  # Proves the declared dependency *floors* are real: a user resolving to the
  # oldest allowed boto3/mcp must still get a working server.
  min-versions:
    name: test (lowest supported dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install lowest direct runtime dependencies
        run: |
          python -m pip install --upgrade pip uv
          uv venv /tmp/lowest
          uv pip install --python /tmp/lowest/bin/python --resolution lowest-direct -e .
          uv pip install --python /tmp/lowest/bin/python pytest pytest-cov pytest-randomly hypothesis

      - name: pytest against the floor versions
        run: /tmp/lowest/bin/python -m pytest --no-cov

  build:
    name: build (sdist + wheel)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build distributions
        run: python -m build

      - name: Validate distribution metadata
        run: twine check dist/*

      # Smoke-test the *built wheel* (not the source tree) so a packaging
      # mistake - missing module, broken entry point - fails before release.
      - name: Install the wheel and run its entry point
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/aws-sso-mcp --version
          /tmp/smoke/bin/python -c "import aws_sso_mcp, importlib.metadata as m; assert aws_sso_mcp.__version__ == m.version('aws-sso-mcp') != '0+unknown'"
