name: Publish to TestPyPI

# Manual rehearsal of the PyPI release: builds the exact artifacts, publishes
# them to TestPyPI via Trusted Publishing (OIDC, no stored token), then
# installs the result *from TestPyPI* and runs the console script. Run it
# before the first real release and after any packaging change.
#
# TestPyPI never accepts the same version twice, so the build is stamped with a
# unique PEP 440 dev version (<version>.dev<run_number>). The stamp exists only
# inside this run; nothing is committed.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testpypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testpypi:
    name: Build, publish to TestPyPI, verify install
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/aws-sso-mcp
    permissions:
      id-token: write # OIDC token for TestPyPI Trusted Publishing
    env:
      RUN_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Stamp a unique dev version
        id: version
        run: |
          python - <<'EOF'
          import os, pathlib, re
          path = pathlib.Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          match = re.search(r'^version = "([^"]+)"', text, re.MULTILINE)
          assert match, "version not found in pyproject.toml"
          stamped = f"{match.group(1)}.dev{os.environ['RUN_NUMBER']}"
          path.write_text(text.replace(match.group(0), f'version = "{stamped}"', 1), encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={stamped}\n")
          EOF

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Publish to TestPyPI (Trusted Publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@a892a5a61159132606e93a2fa6f4358831b04d26 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

      # The index can lag a few seconds behind the upload, so retry. Runtime
      # dependencies are not on TestPyPI, hence the extra index for them.
      - name: Install from TestPyPI and run the entry point
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -m venv /tmp/verify
          for attempt in 1 2 3 4 5 6; do
            if /tmp/verify/bin/pip install \
                 --index-url https://test.pypi.org/simple/ \
                 --extra-index-url https://pypi.org/simple/ \
                 "aws-sso-mcp==${VERSION}"; then
              break
            fi
            [ "$attempt" = 6 ] && { echo "package never became installable"; exit 1; }
            sleep 15
          done
          /tmp/verify/bin/aws-sso-mcp --version | tee /dev/stderr | grep -F "${VERSION}"
