name: Release

# Automated release pipeline:
#   1. On every push to main, release-please maintains a "release PR" that bumps
#      the SemVer version and updates CHANGELOG.md from Conventional Commits.
#   2. When that release PR is merged, release-please creates a GitHub Release
#      and tag. This workflow then builds the wheel + sdist and publishes them
#      to PyPI via Trusted Publishing (OIDC) -- no stored API token.
#   3. Each published artifact gets a signed SLSA build-provenance attestation
#      and a CycloneDX SBOM, so consumers can verify *what* was built, *from
#      which commit*, and *by which workflow*:
#          gh attestation verify <file> --repo arnabdas24/aws-sso-mcp
#
# SECURITY RULE: publishing is deterministic tooling only. No long-lived
# credentials are stored; PyPI auth uses short-lived OIDC tokens minted by the
# `pypi` environment.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Manage release PR / GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tags/releases and the release PR
      pull-requests: write # open/update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Build and publish to PyPI
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aws-sso-mcp
    permissions:
      contents: write # attach built artifacts to the GitHub Release
      id-token: write # OIDC token for PyPI Trusted Publishing and attestations
      attestations: write # record the build-provenance attestation
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      # Provenance is attested *before* publishing, so the bytes that go to
      # PyPI are exactly the bytes covered by the signed attestation.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@a892a5a61159132606e93a2fa6f4358831b04d26 # v1.14.2

      - name: Attach artifacts and SBOM to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" dist/* sbom.cyclonedx.json --clobber
