name: Release

# Automated release pipeline:
#   1. On every push to main, release-please maintains a "release PR" that bumps
#      the SemVer version and updates CHANGELOG.md from Conventional Commits.
#   2. When that release PR is merged, release-please creates a GitHub Release
#      and tag. This workflow then builds the wheel + sdist and publishes them
#      to PyPI via Trusted Publishing (OIDC) -- no stored API token.
#   3. Each published artifact gets a signed SLSA build-provenance attestation
#      and a CycloneDX SBOM, so consumers can verify *what* was built, *from
#      which commit*, and *by which workflow*:
#          gh attestation verify <file> --repo arnabdas24/aws-sso-mcp
#
# SECURITY RULE: publishing is deterministic tooling only. No long-lived
# credentials are stored; PyPI auth uses short-lived OIDC tokens minted by the
# `pypi` environment.

on:
  push:
    branches: [main]
  # Manual publish of an existing tag (e.g. the first release, which
  # release-please does not create because the manifest already says 0.1.0).
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag and GitHub Release to publish, e.g. v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Manage release PR / GitHub Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create tags/releases and the release PR
      pull-requests: write # open/update the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # PRs opened with GITHUB_TOKEN do not trigger CI. Add a RELEASE_PLEASE_TOKEN
          # secret (PAT or GitHub App token) so the release PR gets checks too.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please bumps pyproject.toml but does not update uv.lock, so the
      # release PR would fail `uv sync --locked`. Refresh the lock on its branch.
      - name: Checkout the release PR branch
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          persist-credentials: false

      - name: Set up Python
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Sync uv.lock with the release version
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          # env is evaluated even when the step's `if` is false; `pr` is empty when a release
          # PR is merged, and fromJSON('') would fail the whole job before publishing.
          BRANCH: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
          REPO: ${{ github.repository }}
        run: |
          python -m pip install --upgrade uv
          uv lock
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: sync uv.lock with the release version"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:${BRANCH}"

  # Full test suite on the commit being released; publishing waits for it.
  verify:
    name: Test before publishing
    needs: release-please
    if: >-
      always() && (github.event_name == 'workflow_dispatch' ||
      needs.release-please.outputs.release_created == 'true')
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build and publish to PyPI
    needs: [release-please, verify]
    if: >-
      always() && needs.verify.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
      needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: pypi
      url: https://pypi.org/p/aws-sso-mcp
    permissions:
      contents: write # attach built artifacts to the GitHub Release
      id-token: write # OIDC token for PyPI Trusted Publishing and attestations
      attestations: write # record the build-provenance attestation
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag_name || inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      # Guards against publishing a tag whose package version was never bumped.
      - name: Check the built version matches the tag
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
        run: |
          ls dist/
          test -n "$(ls dist/aws_sso_mcp-"${TAG_NAME#v}"-*.whl 2>/dev/null)" || {
            echo "::error::built wheel does not match tag ${TAG_NAME}"; exit 1; }

      - name: Smoke-test the built wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          /tmp/smoke/bin/aws-sso-mcp --version

      # Provenance is attested *before* publishing, so the bytes that go to
      # PyPI are exactly the bytes covered by the signed attestation.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

      - name: Attach artifacts and SBOM to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
        run: gh release upload "$TAG_NAME" dist/* sbom.cyclonedx.json --clobber
