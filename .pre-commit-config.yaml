# Install once:  uv run pre-commit install --hook-type pre-commit --hook-type commit-msg
# Run on all files:  uv run pre-commit run --all-files
minimum_pre_commit_version: "3.5.0"

default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=512"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        name: ruff (lint)
        args: ["--fix"]
      - id: ruff-format
        name: ruff (format)

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, src)
        entry: mypy src
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true

      - id: doc-links
        name: documentation links and anchors
        entry: python scripts/check_doc_links.py
        language: system
        files: \.md$
        pass_filenames: false

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.20.0
    hooks:
      - id: commitlint
        name: commitlint (Conventional Commits)
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional@19.6.0"]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        name: actionlint (GitHub Actions)

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: gitleaks (secret scan)
